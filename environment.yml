# Exact environment for reproducing the results of the gtellcorr paper.
#   conda env create -f environment.yml && conda activate gtellcorr
#   pip install -e ".[dev]"
name: gtellcorr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=1.26.4
  - scipy=1.12.0
  - astropy=7.2.0
  - platformdirs
  - pandas=2.3.3
  - requests=2.32.5
  - matplotlib-base=3.11.2
  - pip:
      - pymsis==0.12.0
      - netCDF4==1.7.4
      - cdsapi==0.7.7
      - emcee==3.1.6
      # stellar templates
      - pysme-astro==1.0.2
      # needed by iSpec (external installation, Settings.ispec_dir)
      - statsmodels==0.14.6
